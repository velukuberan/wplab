services:
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: wplab-mailpit
    restart: unless-stopped
    environment:
      # Use a persistent SQLite database in the existing named volume.
      MP_DATABASE: /data/mailpit.db
      # Retain recent development messages, pruning older ones.
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit_data:/data
    networks:
      - web
      - wplab-mail
    labels:
      # Keep the existing local Mailpit URL via Traefik (HTTP port 8025).
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.mailpit.rule=Host(`mail.wplab.test`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

volumes:
  mailpit_data:

networks:
  web:
    external: true
  wplab-mail:
    external: true
